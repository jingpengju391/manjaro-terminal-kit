# Terminal compatibility and familiar shell.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g default-shell /usr/bin/zsh
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix remains Ctrl-b. New panes open in the current directory.
bind "|" split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# Quiet status bar with session, windows and time.
set -g status-style "bg=default,fg=#AAB2BF"
set -g status-left "#[fg=#61AFEF,bold] #S #[default] "
set -g status-left-length 24
set -g status-right '#($HOME/.local/libexec/tmux-monitor-window.py #{window_id})' 
set -g status-interval 5
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#98C379,bold] #I:#W #[default]"
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#61AFEF"

# Easy alternative: prefix then backslash for side-by-side panes.
bind "\\" split-window -h -c "#{pane_current_path}"

# Switch panes directly with Alt + arrow keys.
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Switch tmux windows directly with Ctrl + Left/Right.
bind-key -n C-Left previous-window
bind-key -n C-Right next-window

# Create a window in the current directory with Ctrl-N.
bind-key -n C-n new-window -c "#{pane_current_path}"

# System monitor at the top.
set -g status-position bottom
set -g status-right-length 90

# One full-width monitor pane above each window's working panes.
set-hook -g after-new-window 'run-shell -b "$HOME/.local/libexec/tmux-monitor-window.py #{window_id}"'
set-hook -g after-new-session 'run-shell -b "$HOME/.local/libexec/tmux-monitor-window.py #{window_id}"'
set-hook -g client-attached 'run-shell -b "$HOME/.local/libexec/tmux-monitor-window.py #{window_id}"'

# Direct splits: Ctrl-backslash and Ctrl-minus.
bind-key -n C-\\ split-window -h -c "#{pane_current_path}"
bind-key -n C-- split-window -v -c "#{pane_current_path}"
set-hook -g after-select-window 'run-shell -b "$HOME/.local/libexec/tmux-monitor-window.py #{window_id}"'

# Restore the monitor's three rows after terminal size changes.
set-hook -g window-resized 'run-shell -b "$HOME/.local/libexec/tmux-monitor-window.py #{window_id}"'

# Close the current window with confirmation.
bind-key -n C-y confirm-before -p "Close window #W? (y/n)" kill-window

# Remove previous direct pane navigation when reloading.
unbind-key -n C-Up
unbind-key -n C-Down

# Remove old split bindings; support legacy Ctrl-minus encoding.
unbind-key -n M-\\
unbind-key -n M--
bind-key -n C-_ split-window -v -c "#{pane_current_path}"

# Desktop clipboard: tmux selects text; helper chooses X11 xclip or Wayland wl-copy.
set -s set-clipboard off
set -s copy-command '$HOME/.local/libexec/tmux-clipboard >/dev/null'
bind-key -T root MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -M }
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
setw -g mode-style 'fg=#FFFFFF,bg=#356A96,bold'

# tmux 3.7: explicitly style the selected range, not only mode UI.
setw -g copy-mode-selection-style "fg=#FFFFFF,bg=#356A96,bold"
