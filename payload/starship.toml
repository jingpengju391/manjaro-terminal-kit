# version: 1.0.0
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](#D8DEE9)"

format = """$nix_shell$container$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$character"""

right_format = """
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$maven\
$nim\
$nodejs\
$bun\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time"""

[fill]
symbol = ' '

[character]
success_symbol = "[❯](bold #9BC8AC)"
error_symbol = "[❯](bold #E06C75)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = '#98C379 '

[sudo]
format = "[$symbol]($style)"
style = "bold #C678DD"
symbol = "⋈┈"
disabled = false

[username]
style_user = "#E5C07B bold "
style_root = "#C678DD bold "
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "~"
truncation_length = 2
truncation_symbol = "…/"
style = "bold #61AFEF"
format = "[$path]($style)[$read_only]($read_only_style) "

[cmd_duration]
format = "[◄ $duration ](#D8DEE9)"

[jobs]
format = "[$symbol$number]($style) "
style = "#D8DEE9"
symbol = "[▶](#61AFEF )"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold #C678DD)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "#D8DEE9"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](bold #98C379)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "bold #E06C75"

[[battery.display]]
threshold = 60
style = "#C678DD"

[[battery.display]]
threshold = 70
style = "#E5C07B"

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "#61AFEF"

[git_metrics]
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
added_style = '#98C379'
deleted_style = '#E06C75'
disabled = false

[git_status]
style = "#E5C07B"

[deno]
style = "#D8DEE9"

[lua]
style = "bold #E5C07B"

[nodejs]
style = "#D8DEE9"

[bun]
style = "#D8DEE9"

[python]
style = "bold #E5C07B"

[ruby]
style = "bold #E06C75"

[rust]
symbol = "🦀 "
format = "[$symbol($version)]($style) "
style = "bold #E06C75"

[package]
symbol = "📦 "
format = "[$symbol$version]($style) "
style = "bold #E5C07B"

[swift]
style = "bold #E06C75"

[aws]
disabled = true
format = " [aws]() [$symbol $profile $region]($style)"
style = "bold #61AFEF"
symbol = "▲ "

[buf]
style = "#D8DEE9"

[c]
style = "#D8DEE9"

[cpp]
style = "#D8DEE9"

[conda]
style = "#D8DEE9"

[pixi]
style = "#D8DEE9"

[dart]
style = "#D8DEE9"

[docker_context]
style = "#D8DEE9"

[elixir]
style = "#D8DEE9"

[elm]
style = "#D8DEE9"

[golang]
style = "#D8DEE9"

[haskell]
style = "#D8DEE9"

[java]
style = "#D8DEE9"

[julia]
style = "#D8DEE9"

[memory_usage]
style = "#D8DEE9"

[nim]
style = "#D8DEE9"

[nix_shell]
style = 'bold #61AFEF'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](#D8DEE9)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
unknown_msg = '[◌](bold dimmed yellow)'

[spack]
style = "#D8DEE9"

